; Toporia PHP Configuration
; Optimized for large file imports

; Upload limits (2GB for large CSV imports)
upload_max_filesize = 2G
post_max_size = 2G

; Memory limit (increased for large imports)
memory_limit = 1G

; Execution time (10 minutes for large operations)
max_execution_time = 600
max_input_time = 600

; Input vars (for large forms)
max_input_vars = 10000

; Error handling
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php/error.log
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Date timezone
date.timezone = UTC

; OPcache settings
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

; Realpath cache
realpath_cache_size = 4096K
realpath_cache_ttl = 600
